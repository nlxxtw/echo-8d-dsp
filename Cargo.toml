[package]
name = "echo_8d_dsp"
version = "1.0.0"
edition = "2021"
description = "Dynamic rotating 8D / binaural swirl DSP provider for EchoMusic"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]
name = "echo_8d_dsp"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
